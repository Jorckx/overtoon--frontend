<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance</title>
<style>
  html, body { height: 100%; margin: 0; background: #fff; }

  .resonance {
    position: fixed;
    right: 2vmin;
    bottom: 2vmin;
    display: flex;
    align-items: flex-end;      /* all shapes share one baseline */
    gap: 1.6vmin;
    pointer-events: none;       /* never blocks clicks on the page */
  }

  .shape {
    width: 10px; height: 10px;  /* real size is set by JS */
    background: #333;
    border-radius: 50%;
    flex: none;
  }

  /* ring: ellipse with a transparent elliptical hole, so wall thickness
     changes naturally as width/height change */
  .ring {
    --mask: radial-gradient(ellipse 27.5% 30.5% at 50% 50%, transparent 98%, #000 100%);
    -webkit-mask: var(--mask);
            mask: var(--mask);
  }
</style>
</head>
<body>

<div class="resonance" aria-hidden="true">
  <div class="shape dot"></div>
  <div class="shape ring"></div>
  <div class="shape ring"></div>
  <div class="shape ring"></div>
</div>

<script>
  const els = [...document.querySelectorAll('.resonance .shape')];

  // Base sizes in vmin units, plus how each shape reacts to the cursor.
  //  invW / invH: reverse the direction for counter-motion
  //  stiff / damp: spring feel (lower stiff = slower, lower damp = more wobble)
  const shapes = [
    { w: 4.3, h: 4.3,  invW: false, invH: false, stiff: 0.040, damp: 0.82 },  // dot
    { w: 22,  h: 10,   invW: false, invH: true,  stiff: 0.035, damp: 0.84 },  // wide ring
    { w: 9,   h: 33,   invW: true,  invH: false, stiff: 0.028, damp: 0.86 },  // mid ring
    { w: 9,   h: 60,   invW: false, invH: false, stiff: 0.020, damp: 0.88 },  // tall ring
  ].map(s => ({ ...s, cw: 0, ch: 0, vw: 0, vh: 0, init: false }));

  const RANGE = [0.6, 1.4];   // size multiplier at the extremes of the cursor range
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let nx = 0.5, ny = 0.5, running = false;

  const lerp = (a, b, t) => a + (b - a) * t;

  function tick() {
    const u = Math.min(innerWidth, innerHeight) / 100;   // 1 vmin in px
    const maxH = innerHeight * 0.88;
    let moving = false;

    shapes.forEach((s, i) => {
      const tx = s.invW ? 1 - nx : nx;
      const ty = s.invH ? ny : 1 - ny;                    // cursor higher = taller
      const targetW = s.w * u * lerp(RANGE[0], RANGE[1], tx);
      const targetH = Math.min(s.h * u * lerp(RANGE[0], RANGE[1], ty), maxH);

      if (!s.init || reduceMotion) {
        s.cw = targetW; s.ch = targetH; s.vw = s.vh = 0; s.init = true;
      } else {
        s.vw = (s.vw + (targetW - s.cw) * s.stiff) * s.damp;
        s.vh = (s.vh + (targetH - s.ch) * s.stiff) * s.damp;
        s.cw += s.vw;
        s.ch += s.vh;
        if (Math.abs(s.vw) > 0.01 || Math.abs(s.vh) > 0.01 ||
            Math.abs(targetW - s.cw) > 0.1 || Math.abs(targetH - s.ch) > 0.1) moving = true;
      }

      els[i].style.width  = s.cw.toFixed(2) + 'px';
      els[i].style.height = s.ch.toFixed(2) + 'px';
    });

    if (moving) requestAnimationFrame(tick); else running = false;
  }

  function wake() {
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  // pointermove covers mouse, pen and touch
  addEventListener('pointermove', e => {
    nx = e.clientX / innerWidth;
    ny = e.clientY / innerHeight;
    wake();
  });
  addEventListener('resize', wake);
  wake();
</script>
</body>
</html>
